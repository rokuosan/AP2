name: AP2 cards image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ap2-cards-image.yaml'
      - 'README.md'
      - 'pyproject.toml'
      - 'code/sdk/python/**'
      - 'code/samples/certs/**'
      - 'code/samples/python/**'
      - 'code/web-client/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ap2-cards-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'rokuosan/AP2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: code/samples/python/scenarios/a2a/human-present/cards/kubernetes/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/rokuosan/ap2-cards:latest
            ghcr.io/rokuosan/ap2-cards:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-client:
    strategy:
      matrix:
        flow: [card, x402]
    if: github.repository == 'rokuosan/AP2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: code/web-client
          build-args: FLOW=${{ matrix.flow }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/rokuosan/ap2-web-${{ matrix.flow }}:latest
            ghcr.io/rokuosan/ap2-web-${{ matrix.flow }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ap2-web-${{ matrix.flow }}
          cache-to: type=gha,mode=max,scope=ap2-web-${{ matrix.flow }}
