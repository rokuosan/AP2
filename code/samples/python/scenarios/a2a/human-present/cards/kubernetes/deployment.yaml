apiVersion: apps/v1
kind: Deployment
metadata:
  name: ap2-cards
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ap2-cards
  template:
    metadata:
      labels:
        app: ap2-cards
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: state
          emptyDir: {}
      containers:
        - name: shopping
          image: ap2-cards:vllm
          command: [adk, web, --host, 0.0.0.0, /app/code/samples/python/src/roles]
          envFrom: &modelConfig
            - configMapRef:
                name: ap2-cards-model
            - secretRef:
                name: ap2-cards-model
                optional: true
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /list-apps
              port: http
          volumeMounts: &state
            - name: state
              mountPath: /state
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        - name: merchant
          image: ap2-cards:vllm
          command: [python, -m, roles.merchant_agent]
          envFrom: *modelConfig
          readinessProbe:
            exec:
              command: [python, -c, 'import socket; socket.create_connection(("127.0.0.1", 8001), 1).close()']
          volumeMounts: *state
          securityContext: *containerSecurity
        - name: credentials-provider
          image: ap2-cards:vllm
          command: [python, -m, roles.credentials_provider_agent]
          envFrom: *modelConfig
          readinessProbe:
            exec:
              command: [python, -c, 'import socket; socket.create_connection(("127.0.0.1", 8002), 1).close()']
          volumeMounts: *state
          securityContext: *containerSecurity
        - name: payment-processor
          image: ap2-cards:vllm
          command: [python, -m, roles.merchant_payment_processor_agent]
          envFrom: *modelConfig
          readinessProbe:
            exec:
              command: [python, -c, 'import socket; socket.create_connection(("127.0.0.1", 8003), 1).close()']
          volumeMounts: *state
          securityContext: *containerSecurity
---
apiVersion: v1
kind: Service
metadata:
  name: ap2-cards
spec:
  selector:
    app: ap2-cards
  ports:
    - port: 8000
      targetPort: http
