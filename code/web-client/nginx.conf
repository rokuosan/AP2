server {
    listen 8000;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /a2a/shopping_agent {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location = /merchant/state {
        proxy_pass http://127.0.0.1:8081/state;
    }

    location = /merchant/trigger-price-drop {
        proxy_pass http://127.0.0.1:8081/trigger-price-drop;
    }
}
